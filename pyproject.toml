[project]
name = "llm-from-scratch-explainer"
version = "0.1.0"
description = "Interactive explainer for Raschka's 'Build a LLM (From Scratch)' ch. 1-3, running the book's final code."
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.5",
    "tiktoken>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "safetensors>=0.4",
    "huggingface_hub>=0.25",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "transformers>=4.45",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_from_scratch", "app"]
