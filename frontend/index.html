<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM From Scratch · scene explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="sigil">Σ</span><span class="name">LLM From Scratch</span><span class="sub">Raschka · ch. 1–3 · live tensors</span></div>
  <nav id="path" aria-label="sections"></nav>
  <div id="health" class="health">…</div>
</header>

<div id="bar">
  <label class="field grow"><span>text</span><input id="g-text" type="text" spellcheck="false" autocomplete="off"></label>
  <label class="field"><span>seed</span><input id="g-seed" type="number"></label>
  <div class="field"><span>weights</span>
    <div class="seg" id="g-weights"><button data-v="random" class="on">random · book</button><button data-v="gpt2">GPT-2 small</button></div></div>
  <div class="field"><span>cells</span>
    <div class="seg" id="g-numbers"><button data-v="0" class="on">colour</button><button data-v="1">numbers</button></div></div>
</div>

<div id="panelbar"><div id="title"></div><div id="controls"></div>
  <div class="ctl"><span>zoom</span><div class="seg" id="zoom"><button data-z="fit" class="on">fit</button><button data-z="1">1:1</button><button data-z="-">−</button><button data-z="+">+</button></div></div>
</div>

<main id="body">
  <section id="stage" tabindex="0"><div id="scene-wrap"></div></section>
  <aside id="inspector">
    <div id="probe" class="probe empty">hover anything in the scene</div>
    <div id="guide"></div>
  </aside>
</main>

<footer id="scrub">
  <div class="scrub-head">
    <button id="s-prev" title="previous line (←)">‹</button>
    <button id="s-play" title="play">▶</button>
    <button id="s-next" title="next line (→)">›</button>
    <input id="s-range" type="range" min="0" max="0" value="0">
    <span id="s-label" class="mono"></span>
  </div>
  <pre id="code" class="code"></pre>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
